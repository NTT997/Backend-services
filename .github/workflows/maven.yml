name: Build Pharmacy Spring Boot Project

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # === Build Core App ===
      - name: Build sm-shop (without tests)
        # working-directory: sm-shop
        run: mvn clean install -DskipTests
        # run: mvn clean install -P aggregate-all
        
        
      # # === Build Gateway App ===
      # - name: Build api-gateway (without tests)
      #   working-directory: api-gateway
      #   run: mvn clean install -DskipTests
      #   #run: mvn clean install -B -DskipTests
      #   #run: mvn clean install -DskipTests
        
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-  
            
